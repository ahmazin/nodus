<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Nodus — diagram playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Dark page background so there's no white flash before React mounts (matches the token canvas). */
      html, body, #root { margin: 0; height: 100%; background: #0a0b0e; color: #e9e9ee; }
      * { box-sizing: border-box; }
      body { font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
      ::selection { background: #c4f24e; color: #0a0b0e; }

      /* Live-doc pulse + popover entrance, both reduced-motion-safe (see the media query below). */
      @keyframes nd-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes nd-pop { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: none; } }
      .nd-pulse-dot { animation: nd-pulse 2.4s ease-in-out infinite; }
      .nd-pop { animation: nd-pop 0.12s ease-out; }

      /* Film-grain canvas overlay (main.tsx's `.nd-grain` div): pans the same static noise tile through
         a handful of irregular offsets, held with `steps()` so it reads as a slow flicker rather than a
         smooth scroll. Reduced-motion-safe (see the media query below) — it just freezes on one frame. */
      @keyframes nd-grain {
        0%, 100% { background-position: 0 0; }
        10% { background-position: -37px 12px; }
        20% { background-position: 58px -46px; }
        30% { background-position: -19px 63px; }
        40% { background-position: 71px 24px; }
        50% { background-position: -54px -33px; }
        60% { background-position: 33px 57px; }
        70% { background-position: -68px -12px; }
        80% { background-position: 14px -59px; }
        90% { background-position: -41px 38px; }
      }
      .nd-grain { animation: nd-grain 5s steps(10) infinite; }

      /* Header buttons have no [data-nodus-ui] ancestor, so the press-scale from
         packages/react/src/ui/global-styles.ts is mirrored here for them. */
      header button { transition: transform 80ms ease; }
      header button:active { transform: scale(0.97); }

      @media (prefers-reduced-motion: reduce) {
        .nd-pulse-dot, .nd-pop, .nd-grain { animation: none !important; }
        header button { transform: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
