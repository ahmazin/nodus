<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 84" width="300" height="84" role="img" aria-label="Nodus">
  <title>Nodus</title>
  <!-- knot mark: one lime node + two outlined nodes joined by edges (Nodus = Latin "knot/node") -->
  <g fill="none" stroke-linecap="round">
    <path d="M24 36 L35 52 M54 33 L43 52 M28 28 L50 26" stroke="#6f7480" stroke-width="4"/>
    <circle cx="20" cy="30" r="8" fill="#c4f24e" stroke="none"/>
    <circle cx="58" cy="26" r="7.5" stroke="#15171c" stroke-width="4.5"/>
    <circle cx="39" cy="60" r="8" stroke="#15171c" stroke-width="4.5"/>
  </g>
  <!-- wordmark: dark for light backgrounds -->
  <text x="84" y="56" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.2" fill="#15171c">Nodus</text>
</svg>
