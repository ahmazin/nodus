blank_issues_enabled: false
contact_links:
  - name: Questions, ideas & help
    url: https://github.com/ahmazin/nodus/discussions
    about: >
      For questions, usage help, ideas, and showing what you built, please use GitHub Discussions.
      Issues are reserved for tracked bugs and feature requests.
  - name: Report a security vulnerability
