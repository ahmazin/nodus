name: Release

# Publishing pipeline (changesets flow):
#   1. PRs land on mainline carrying `.changeset/*.md` intent files (enforced by changeset-status in ci.yml).
#   2. On push to mainline, changesets/action opens/updates a "Version Packages" PR that applies all
#      pending changesets: bumps versions, rewrites CHANGELOGs, deletes the intent files.
#   3. Merging that PR re-triggers this workflow; the action detects unpublished versions and runs
#      `pnpm release` (verify:all -> build -> changeset publish), then pushes git tags and creates
#      GitHub Releases per package.
# Publishing needs the NPM_TOKEN repo secret: an npm *granular access* token with read/write on the
# @nodus-dev scope. `id-token: write` + NPM_CONFIG_PROVENANCE enable npm provenance attestation, which
# links every published tarball to this exact commit and workflow run.
# Note: the Version Packages PR is created with GITHUB_TOKEN, so CI does not auto-run on that PR
# (GitHub prevents token-triggered workflow recursion) — the publish path re-runs the full verify
# suite itself, so nothing ships unverified.

on:
  push:
    branches: [mainline]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # version commit, tags, GitHub Releases
  pull-requests: write # the Version Packages PR
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # changesets diffs against baseBranch history
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: pnpm release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

  # Post-publish registry smoke: only runs when the release job actually published tarballs. Installs
  # the public-surface packages fresh from the npm registry (retrying to absorb propagation lag — the
  # exact failure class that hid the 46h partial-publish where `@nodus-dev/core@^0.2.0` was
  # unresolvable), require()/bin-checks each, and asserts npm provenance materialized
  # (dist.attestations non-null). This is the gate that would have caught both the missing-package and
  # missing-provenance regressions from the manual-publish bypass.
  smoke:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Clean-install from public registry + require/bin/attestations check
        run: |
          set -euo pipefail
          d=$(mktemp -d); cd "$d"; npm init -y >/dev/null
          for i in 1 2 3 4 5; do
            npm install @nodus-dev/core @nodus-dev/react @nodus-dev/cli @nodus-dev/mcp && break || {
              echo "propagation retry $i"; sleep 20
              [ "$i" -eq 5 ] && exit 1
            }
          done
          node -e "require('@nodus-dev/core'); console.log('core require OK')"
          node -e "require('@nodus-dev/react'); console.log('react require OK')"
          npx --yes @nodus-dev/cli --help >/dev/null && echo "cli bin OK"
          test -f node_modules/@nodus-dev/mcp/package.json && echo "mcp installed OK"
          for p in @nodus-dev/core @nodus-dev/react @nodus-dev/cli @nodus-dev/mcp; do
            att=$(npm view "$p" dist.attestations --json 2>/dev/null || echo "null")
            if [ "$att" = "null" ] || [ -z "$att" ]; then
              echo "::error::$p has no dist.attestations (npm provenance did not materialize)"; exit 1
            fi
            echo "$p provenance OK"
          done
