name: Diagrams

# "Diagrams you can code-review": on any PR that touches a *.nodus.json diagram, fail if it is not
# in canonical form (so diffs stay clean) and post rendered previews. Runs the `nodus` CLI via the
# repo's tsx entry point (pnpm nodus …), the same way the other headless scripts run.
#
# Security: all PR-controlled values (branch name, changed file paths) are passed through `env:` and
# referenced as quoted shell data / process.env — NEVER interpolated as ${{ }} into run/script bodies,
# which would let a file named `$(evil).nodus.json` inject commands.
on:
  pull_request:
    paths:
      - '**/*.nodus.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Collect changed diagrams
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 || true
          files=$(git diff --name-only "origin/$BASE_REF...HEAD" -- '*.nodus.json' || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Format gate (fail if any diagram is not canonical)
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: printf '%s\n' "$FILES" | xargs -r -d '\n' pnpm -s nodus fmt --check

      - name: Render changed diagrams
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          mkdir -p .diagram-renders
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            out=".diagram-renders/$(printf '%s' "$f" | tr '/' '_').png"
            pnpm -s nodus render "$f" --out "$out"
          done <<< "$FILES"

      - name: Upload rendered previews
        if: steps.changed.outputs.files != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagram-renders
          path: .diagram-renders/

      # Same-repo PRs get a sticky PR comment. Fork PRs run with a read-only GITHUB_TOKEN, so
      # issues.createComment would throw "Resource not accessible by integration" and fail the job —
      # gate this step to same-repo and fall back to the job summary for forks (next step).
      - name: Comment on PR
        if: steps.changed.outputs.files != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          FILES: ${{ steps.changed.outputs.files }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const files = (process.env.FILES || '').trim().split('\n').filter(Boolean);
            const marker = '<!-- nodus-diagrams -->';
            const body = [
              marker,
              '### 📐 Diagram changes',
              '',
              'Canonical format check **passed** — these diagrams have clean, reviewable diffs.',
              'Rendered previews are attached to this run as the **diagram-renders** artifact.',
              '',
              ...files.map((f) => '- `' + f + '`'),
              '',
              `[View rendered PNGs →](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      # Fork PRs cannot receive a PR comment (read-only token) — write the same summary to the run's
      # job summary instead. FILES is passed via env (never interpolated into the shell body) per the
      # injection-safety convention documented at the top of this file.
      - name: Diagram summary (fork fallback)
        if: steps.changed.outputs.files != '' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          {
            echo '### 📐 Diagram changes'
            echo ''
            echo 'Canonical format check **passed** — these diagrams have clean, reviewable diffs.'
            echo 'Rendered previews are attached to this run as the **diagram-renders** artifact.'
            echo ''
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              printf -- '- `%s`\n' "$f"
            done <<< "$FILES"
          } >> "$GITHUB_STEP_SUMMARY"
