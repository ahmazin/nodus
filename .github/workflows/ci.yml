name: CI

# Code-quality gate: typecheck, the full test suite, and a headless Skia render on every PR and on
# pushes to the main branches. Mirrors the pnpm/Node setup used by diagrams.yml — pnpm/action-setup@v4
# honors the pinned `packageManager: pnpm@11.1.2`, so the pnpm version is fixed without a separate
# `corepack enable` step (the two can conflict), and setup-node's `cache: pnpm` keys off the pnpm store.
on:
  push:
    branches: [main, mainline]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Verify render (headless Skia)
        run: pnpm verify:render
      # Advisory-only: surfaces known advisories in production deps without gating. A moderate
      # postcss-via-astro advisory currently sits under apps/site; `|| true` keeps it non-blocking
      # until it is overridden. Dependabot (below) is the enforcing channel.
      - name: Dependency audit (advisory)
        run: pnpm audit --prod || true

  # Site gate: builds the Astro marketing/docs site the same way the Pages deploy does — generate the
  # typedoc API reference into apps/site/public/api, then run the site build (astro build + the
  # examples/browser playground bundle). The build compiles every page/import, so a broken page,
  # missing asset, or bad link fails here before it can reach production. (A dedicated `astro check`
  # type gate needs the @astrojs/check + typescript devDeps, deferred to the tooling wave.)
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate API reference
        run: pnpm docs:api
      - name: Build site (docs + landing + playground)
        run: pnpm --filter @nodus-dev/site build

  # Dist-consumption gate: builds every package, packs real npm tarballs, and consumes them from a
  # throwaway project OUTSIDE the workspace — verifying the published `dist/` (ESM + CJS + .d.ts +
  # exports map + workspace:*→version rewrite) actually resolves and renders. This is the one path the
  # src-first dev loop never exercises. Offline-safe (externals are symlinked from the pnpm store, no
  # registry fetch at the verify step), so it needs `pnpm install` + `pnpm build` first, nothing more.
  # Validated locally on linux-x64 (== ubuntu-latest). If a first CI run hits a store-layout quirk,
  # add `continue-on-error: true` here to soften, then re-harden once observed green.
  dist-consume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build
      - name: Verify dist is consumable from outside the workspace
        run: node scripts/verify-dist.mjs

  # Release-hygiene gate: a PR that changes package source must carry a changeset, so every
  # consumer-visible change lands with release notes and a version intent. Docs/tests/tooling-only
  # PRs are exempt via the path filter. `changeset status --since` exits non-zero when a changed
  # package has no changeset.
  changeset-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a changeset for package-source changes
        # Dependabot PRs bump deps via its own flow and cannot author changesets; exempt them
        # from the changeset requirement while the job's earlier steps still run and report green.
        # Guard the step (not the whole job) and key off the stable PR author login, not github.actor.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -qE '^packages/[^/]+/(src/|package\.json)' ; then
            pnpm changeset status --since="origin/$BASE_REF"
          else
            echo "no package source changes — changeset not required"
          fi

  # React-UI interaction gate: drives the real Vite app with headless Chromium (create/drag/undo/
  # rename/auto-layout/flow/cloud-picker) via scripts/browser-verify.mjs, asserting zero console
  # errors. Separate job so a browser-download/GL hiccup is isolated from the pure-logic `verify`
  # job above. playwright-core@1.61 installs chromium-1228, which browser-verify.mjs looks for.
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hard gate. The two inherently-flaky moments — the Chromium download and the browser-verify
    # run itself — each retry once (see the 2-attempt loops below) to absorb transient network/GL
    # hiccups, so a single blip does not fail the PR while a real regression still does.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: |
          set -euo pipefail
          for a in 1 2; do
            node node_modules/playwright-core/cli.js install --with-deps chromium && break || {
              echo "::warning::chromium install attempt $a failed"
              [ "$a" -eq 2 ] && exit 1
              sleep 5
            }
          done
      - name: Interaction E2E (headless Chromium vs. the Vite app)
        run: |
          set -euo pipefail
          # Pin the bind address: Vite's default host is `localhost`, which Node 17+ may resolve
          # to ::1 first — the server then listens on IPv6 only and the 127.0.0.1 readiness curl
          # below never connects.
          pnpm dev --host 127.0.0.1 >/tmp/vite-dev.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          up=""
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5188/ >/dev/null 2>&1; then up=1; echo "dev server up after ${i}s"; break; fi
            if ! kill -0 "$VITE_PID" 2>/dev/null; then echo "::error::dev server exited early"; cat /tmp/vite-dev.log; exit 1; fi
            sleep 1
          done
          if [ -z "$up" ]; then echo "::error::dev server did not become ready"; cat /tmp/vite-dev.log; exit 1; fi
          for a in 1 2; do
            node scripts/browser-verify.mjs && break || {
              echo "::warning::browser-verify attempt $a failed"
              [ "$a" -eq 2 ] && exit 1
              sleep 2
            }
          done
      - name: Upload interaction screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-verify-screenshots
          path: examples/output/

  # Coverage gate: re-runs the suite under V8 coverage (@vitest/coverage-v8, pinned to the vitest 2.x
  # line) and publishes the text summary to the job summary. Its own job so it runs in parallel with
  # `verify` and never slows the critical path. No threshold at launch per the PRR exit criteria — the
  # bar is "the number is visible"; tighten to a floor once a baseline lands.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee /tmp/coverage.txt
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            sed -n '/-----|/,/-----/p' /tmp/coverage.txt 2>/dev/null | tail -40 || tail -40 /tmp/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Bundle-size budgets: builds the packages (dist is required — the src-first dev loop never produces
  # it) and checks the gzip size of the published core + react ESM entries against the `size-limit`
  # budgets declared in each package.json. This gate FAILS on a budget breach, so an accidental
  # dependency bloat is caught at PR time.
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages (dist required for size-limit)
        run: pnpm build
      - name: Bundle size budgets (core + react, gzip)
        run: pnpm size

  # Perf benchmark: NON-BLOCKING advisory signal at launch. Runs the headless engine benchmark
  # (build/render/reflow/hit-test at N=500/2000 + layer-cache invariant checks) and publishes the
  # table to the job summary. continue-on-error keeps runner variance and the documented pan-cliff
  # invariant from gating a merge; promote to a hard gate once cross-runner variance is characterized.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Benchmark (headless engine)
        run: |
          set -o pipefail
          pnpm bench 2>&1 | tee /tmp/bench.txt
      - name: Publish benchmark table
        if: always()
        run: |
          {
            echo '### Benchmark (advisory)'
            echo '```'
            cat /tmp/bench.txt 2>/dev/null || echo 'no benchmark output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Golden-image diff: NON-BLOCKING advisory at launch. Renders the fixed-coordinate fixtures through
  # the headless Skia path and pixel-diffs them against the committed baselines. Held non-blocking
  # because cross-toolchain (sandbox vs. CI Skia) antialiasing jitter is not yet characterized; the
  # diff PNGs are uploaded for inspection. Promote to a hard gate once CI-rendered baselines are the
  # committed source of truth.
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Golden-image diff (headless Skia)
        run: pnpm golden
      - name: Upload golden diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-diffs
          path: scripts/golden/diff/
          if-no-files-found: ignore
