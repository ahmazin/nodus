name: Deploy site (Pages)

# Deploys the Astro marketing + docs site (with the typedoc API reference and the examples/browser
# playground bundled in) to GitHub Pages on every push to mainline that touches the site or its
# inputs. The interim origin is a PROJECT page (ahmazin.github.io/nodus), so the site MUST build with
# `base: '/nodus/'` and the playground at `--base=/nodus/playground/` (SITE lane owns astro.config.mjs
# + build.mjs); otherwise the deployed assets 404.
#
# HUMAN / REPO-SETTINGS PREREQUISITES (not expressible as a file — do these once in repo settings):
#   1. Settings → Pages → Build and deployment → Source = "GitHub Actions".
#   2. (Recommended) Settings → Rules → protect `mainline` and require the CI checks
#      (verify / dist-consume / browser-e2e / site) before merge.
on:
  push:
    branches: [mainline]
    paths:
      - 'apps/site/**'
      - 'examples/browser/**'
      - 'packages/**'
      - 'typedoc.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys; never cancel an in-flight deployment (avoids a half-published site).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The published icons-cloud tarball ships EMPTY placeholder packs (licensing: no provider
      # artwork in the npm tarball). Regenerate real packs from the committed svg/ for the DEPLOYED
      # playground only — this repopulates packages/icons-cloud/src/generated/* in the ephemeral CI
      # checkout (never committed). Skipped silently if the package stays held / svg absent.
      - name: Regenerate cloud icon packs (deploy only)
        run: pnpm build:icons || echo "build:icons skipped"
      # Generate the API reference into apps/site/public/api BEFORE the site build so Astro copies it
      # into dist/. Done here explicitly so the deploy is robust even if build.mjs isn't wired to it.
      - name: Generate API reference
        run: pnpm docs:api
      - name: Build site
        run: pnpm --filter @nodus-dev/site build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
